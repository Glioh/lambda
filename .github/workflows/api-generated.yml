name: API generated output

on:
  push:
  pull_request:

jobs:
  generated:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - run: npm run check:api-generated
      - name: Verify generated API output is committed
        run: |
          changes="$(git status --porcelain -- \
            apps/api/openapi \
            packages/api-client/src/generated)"

          if [ -n "$changes" ]; then
            echo "Generated API output is not clean:"
            echo "$changes"
            exit 1
          fi
